name: Vakter

# Kjorer paa PR og paa push til main. Push-kjoringen er der fordi ikke alt
# gaar via PR i praksis - da vil vi i det minste vite at main er groenn.
on:
  pull_request:
  push:
    branches: [main]

# En ny push til samme gren avbryter forrige kjoring. Uten dette staar det
# i ko, og en vakt man venter paa er en vakt man begynner aa hoppe over.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vakter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Bygget validerer miljovariabler med zod og stopper uten dem.
      # Dummyverdier holder: hver eneste side er dynamisk (verifisert
      # 2026-08-19 - `next build` gir ingen statisk prerendering), saa
      # ingenting spor Supabase paa byggtid. Ekte nokler hoerer ikke
      # hjemme i CI naar de ikke trengs.
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_build_only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Rekkefolgen er med vilje: raskeste og mest presise feil forst.
      # En typefeil skal ikke oppdages etter fire minutter med bygging.
      - name: Typer
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      # Her ligger de fire vaktene: fasit (ingenting forsvinner), tilgang
      # (menyen lover ikke det sida avviser), design (tallene vokser ikke)
      # og monsterkartet (hver rute har et monster).
      - name: Tester og vakter
        run: npx vitest run

      # Sist fordi den er treg. Fanger det de andre ikke ser:
      # klient/server-grensen, manglende imports, ugyldig JSX.
      - name: Bygg
        run: npx next build

  # Egen jobb, saa de raske vaktene rapporterer med en gang. En
  # nettleserjobb som holder pa i noen minutter skal ikke gjore at man
  # slutter aa vente paa svaret fra typesjekken.
  nettleser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Standardnoklene til en LOKAL Supabase. De er de samme for alle
      # lokale instanser, offentlig dokumentert, og gir tilgang til en
      # base som slettes naar jobben er ferdig. Ingen hemmelighet, og
      # derfor ingenting aa rotere eller lekke.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GQ

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fersk base hver kjoring: migrasjonene 0001-> kjores fra repoet og
      # supabase/seed.sql legger inn testdata.
      #
      # Dette er ogsaa den eneste kontrollen paa at HELE settet fortsatt
      # kjorer fra bunn. AGENTS.md sier det skjer av og til; ingen har
      # verifisert det siden 0001 ble skrevet.
      - name: Start Supabase lokalt
        run: npx supabase start

      - name: Hent nettleser
        run: npx playwright install chromium --with-deps

      - name: Bygg
        run: npx next build

      # Maaler det kildelesing ikke kan: kontrast, treffomraader, og at
      # beskyttede ruter faktisk redirigerer naar man ber om dem uten okt.
      - name: Nettlesertester
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # Vakthundene mot katalogen, paa en base bygget fra migrasjonene
      # alene. Feiler de her, er det migrasjonssettet som er galt - ikke
      # noe noen har gjort manuelt i produksjon.
      - name: RLS-vakthund
        if: always()
        run: npx supabase db query --local --file supabase/tests/rls_vakthund.sql

      - name: Stopp Supabase
        if: always()
        run: npx supabase stop --no-backup
