name: Vakter

# Kjorer paa PR og paa push til main. Push-kjoringen er der fordi ikke alt
# gaar via PR i praksis - da vil vi i det minste vite at main er groenn.
on:
  pull_request:
  push:
    branches: [main]

# En ny push til samme gren avbryter forrige kjoring. Uten dette staar det
# i ko, og en vakt man venter paa er en vakt man begynner aa hoppe over.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vakter:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Bygget validerer miljovariabler med zod og stopper uten dem.
      # Dummyverdier holder: hver eneste side er dynamisk (verifisert
      # 2026-08-19 - `next build` gir ingen statisk prerendering), saa
      # ingenting spor Supabase paa byggtid. Ekte nokler hoerer ikke
      # hjemme i CI naar de ikke trengs.
      NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_build_only

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Rekkefolgen er med vilje: raskeste og mest presise feil forst.
      # En typefeil skal ikke oppdages etter fire minutter med bygging.
      - name: Typer
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src

      # Her ligger de fire vaktene: fasit (ingenting forsvinner), tilgang
      # (menyen lover ikke det sida avviser), design (tallene vokser ikke)
      # og monsterkartet (hver rute har et monster).
      - name: Tester og vakter
        run: npx vitest run

      # Sist fordi den er treg. Fanger det de andre ikke ser:
      # klient/server-grensen, manglende imports, ugyldig JSX.
      - name: Bygg
        run: npx next build

  # Egen jobb, saa de raske vaktene rapporterer med en gang. En
  # nettleserjobb som holder pa i noen minutter skal ikke gjore at man
  # slutter aa vente paa svaret fra typesjekken.
  nettleser:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Standardnoklene til en LOKAL Supabase. De er de samme for alle
      # lokale instanser, offentlig dokumentert, og gir tilgang til en
      # base som slettes naar jobben er ferdig. Ingen hemmelighet, og
      # derfor ingenting aa rotere eller lekke.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GQ
      # Signerer vaktkapselen. Ingen hemmelighet her: den gjelder en base
      # som slettes naar jobben er ferdig. Men den maa vaere STABIL
      # gjennom kjoringen - bytter nokkelen, slutter en gyldig vakt aa
      # gjelde ved neste foresporsel, og bevisene ville sett ut som om
      # signaturen var i stykker.
      VAKT_SIGNATUR_SECRET: ci-test-noekkel-for-vaktkapselen-minst-32-tegn

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fersk base hver kjoring: migrasjonene 0001-> kjores fra repoet og
      # supabase/seed.sql legger inn testdata.
      #
      # Dette er ogsaa den eneste kontrollen paa at HELE settet fortsatt
      # kjorer fra bunn. AGENTS.md sier det skjer av og til; ingen har
      # verifisert det siden 0001 ble skrevet.
      #
      # `-x`: ni containere vi ikke bruker. Dette var det tyngste steget
      # i jobben (135 s av 400 maalt 2026-08-20), og det meste av det er
      # nedlasting og oppstart av tjenester ingen test rorer:
      #
      #   studio, meta      administrasjonsgrensesnittet
      #   inbucket          e-postfangst; testene sender ingen
      #   imgproxy          bildetransformasjon
      #   vector, analytics logginnsamling
      #   edge-runtime,
      #   functions         `functions.invoke` finnes ikke i kildekoden
      #   realtime          ingen `.channel()` i kildekoden
      #
      # `storage` staar IGJEN med vilje, selv om ingen test laster opp:
      # /kontrakt og /rutiner leser fra storage under RENDER, betinget av
      # data seeden ikke har i dag. Tok vi den ut, ville en framtidig
      # kontraktmal i seeden felle /kontrakt i CI av en grunn som ikke
      # hadde noe med endringen aa gjore.
      #
      # `db`, `kong` og `rest` er selve basen, og gotrue kan ikke tas
      # ut - det er den innloggede testene lever av.
      # Lokal base fra `supabase start`. Porten staar i supabase/config.toml.
      - name: Sett PGURL
        run: echo "PGURL=postgresql://postgres:postgres@127.0.0.1:54322/postgres" >> "$GITHUB_ENV"

      - name: Start Supabase lokalt
        run: >
          npx supabase start
          -x studio,meta,inbucket,imgproxy,vector,analytics,edge-runtime,functions,realtime

      # Rett etter start, mens basen garantert lever. Foerste utgave laa
      # nederst med `if: always()` - og da kjorte den etter at CLI-en
      # hadde revet containerne, saa den feilet med «connection refused»
      # paa noe som ikke var dens feil. Roedt av feil grunn er verre enn
      # ingen sjekk: det er slik man laerer seg aa se bort fra roedt.
      #
      # Den hoerer hjemme her ogsaa logisk: dette er den ENESTE
      # kontrollen paa at migrasjonene alene gir en riktig base, uten noe
      # noen har gjort for haand i produksjon.
      - name: RLS-vakthund mot fersk base
        run: npx supabase db query --local --file supabase/tests/rls_vakthund.sql

      # PORT 2: tenant-kontrakten.
      #
      # Dekningen foerst - en ny tabell som ingen har klassifisert skal
      # aldri komme forbi her.
      # PSQL, IKKE `supabase db query`. CLI-en sender fila som EN prepared
      # statement, og en fil med flere setninger gir da
      # «cannot insert multiple commands into a prepared statement».
      # Det er den samme grunnen rls_vakthund.sql maa vaere én setning.
      # Matrisen er 457 setninger og kan ikke kjores den veien.
      #
      # ON_ERROR_STOP=1 er ikke pynt: uten den returnerer psql 0 selv om
      # en setning feilet, og et roedt bevis ville blitt en groenn jobb.
      - name: Tenant-dekning
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/tenant_dekning.sql

      # KANARIFUGLEN FOR DEKNINGEN. Tre kall, og alle tre betyr noe:
      # groenn, saa ROED paa en uklassifisert tabell, saa groenn igjen.
      # Uten det siste ville en sjekk som ALLTID feiler ogsaa bestaatt.
      - name: Uklassifisert tabell feller dekningen
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/kanari_uklassifisert.sql
          if psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/tenant_dekning.sql; then
            echo "::error::Dekningskontrollen godtok en uklassifisert tabell - den maaler ingenting"
            psql "$PGURL" -f supabase/tests/kanari_uklassifisert_rydd.sql
            exit 1
          fi
          echo "Dekningen felte den uklassifiserte tabellen, som den skal."
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/kanari_uklassifisert_rydd.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/tenant_dekning.sql

      # Atferdsmatrisen. Generert fra kontrakten - se
      # src/lib/tenant/generer.ts. Tiden logges med vilje: dekning skal
      # ikke kuttes for ytelse foer kjoretiden faktisk er maalt.
      - name: Tenant-atferdsmatrise
        run: |
          start=$(date +%s)
          psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_kanarifugl_generert.sql
          echo "Atferdsmatrisen brukte $(( $(date +%s) - start )) sekunder."

      # Haandskrevet kanarifugl fra PORT 1. Blir staaende til kontrakten
      # dekker alle varme tabeller - den maaler dagens tilstand paa
      # nettbrettet, som matrisen ennaa ikke uttaler seg om.
      - name: Tenant-kanarifugl (PORT 1)
        run: psql "$PGURL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_kanarifugl.sql

      # Hemmeligheten: at pin_hash faktisk er lukket for klientrollen, at
      # verifiseringen virker, at rate limitingen bremser og at
      # revisjonssporet ikke baerer noe hemmelig.
      #
      # SQL og ikke nettleser med vilje: de tre approllene er samme
      # Postgres-rolle, saa et kolonneprivilegium gjelder alle tre. Aa
      # maale det per approlle i en nettleser ville vaert aa maale det
      # samme tre ganger og tro man maalte tre ting.
      - name: pin_hash er lukket
        run: npx supabase db query --local --file supabase/tests/pin_hash_lukket.sql

      # BP mot faktisk per avdeling. Den viktigste invarianten er at
      # omsetning maales mot OMSETNINGSbudsjett og brutto mot
      # bruttobudsjett - aldri paa kryss. Testdataene er 100 000 mot
      # 40 000, saa en kryssing ikke kan gjemme seg i avrunding.
      - name: BP-status per avdeling
        run: npx supabase db query --local --file supabase/tests/bp_status.sql

      # Timene er ikke gitt, de er fortjent: timebudsjett x (realisert
      # brutto / BP-brutto). Testdataene er Roberts to eksempler tall for
      # tall - 12 000 timer paa 4,8 av 5,0 mill gir 11 520, og en aapen
      # maaned verdsettes med kassens OMSETNING til aarets REALISERTE
      # margin, ikke kassens egen.
      - name: Timeregnskap
        run: npx supabase db query --local --file supabase/tests/timeregnskap.sql

      # Faste vakter har perioder fra 0123. En endring i dag skal ikke
      # skrive om hvordan det var i mars: en ny fastloennet vakt fra
      # 1. november gjor ikke oktober fastloennet.
      - name: Faste vakter med periode
        run: npx supabase db query --local --file supabase/tests/fast_vakt_periode.sql

      # Nettleseren mellomlagres paa versjonen i lockfila. Uten dette
      # lastes den ned paa nytt hver kjoring.
      - name: Mellomlager for nettleser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # UTEN --with-deps. Det flagget kjorer apt-get, og en kjoring hang
      # sytten minutter paa Ubuntu-arkivet for den traff timeouten -
      # testene kom aldri i gang. GitHubs runner-image har allerede
      # bibliotekene Chromium trenger; --with-deps er for bare images.
      #
      # Feiler nettleseren aa starte, sier den fra med en gang, og da
      # legger vi inn de faa pakkene som mangler i stedet for hele apt.
      - name: Hent nettleser
        run: npx playwright install chromium

      - name: Bygg
        run: npx next build

      # MIDLERTIDIG. Fjernes foer merge.
      #
      # `stoerste enkeltlinje` flaket fordi den leste innerText paa en
      # kollapset <details>. Fem isolerte kjoringer er beviset paa at
      # rettingen faktisk holder - ett groent kast beviser ingenting naar
      # feilen ER et kast.
      - name: Flakejakt - stoerste enkeltlinje x5
        run: npx playwright test e2e/svinn.spec.ts -g "stoerste enkeltlinje" --repeat-each=5

      # Maaler det kildelesing ikke kan: kontrast, treffomraader, og at
      # beskyttede ruter faktisk redirigerer naar man ber om dem uten okt.
      - name: Nettlesertester
        run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rapport
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # INGEN «stopp supabase». Den sto her og kostet 22 sekunder paa
      # hver eneste kjoring, ogsaa de roede - og loperen kastes likevel
      # i det jobben er ferdig. Det var opprydding etter seg selv i et
      # rom som rives.
